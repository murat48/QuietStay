[workspace]
resolver = "2"
members = ["quietstay-rights", "quietstay-verifier", "quietstay-measure"]
# Third-party code, built in its own workspace with its own lockfile.
exclude = ["vendor"]

[workspace.dependencies]
soroban-sdk = "27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
