[package]
name = "quietstay-rights"
version = "0.1.0"
edition = "2021"
description = "QuietStay Phase 1 — tokenized vacation usage rights with issuer-approved transfer"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# hazmat-address: Address::to_payload, to read a G… account's 32-byte key as an
# identifier the proof binds to (auth.rs). Authentication stays with require_auth.
soroban-sdk = { workspace = true, features = ["hazmat-address"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1"
