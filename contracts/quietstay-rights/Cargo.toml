[package]
name = "quietstay-rights"
version = "0.1.0"
edition = "2021"
description = "QuietStay Phase 1 — tokenized vacation usage rights with issuer-approved transfer"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# hazmat-address: Address::to_payload, to read a G… account's 32-byte key as an
# identifier the proof binds to (auth.rs). Authentication stays with require_auth.
soroban-sdk = { workspace = true, features = ["hazmat-address"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1"
# Real signatures in the Step 3 auth tests (test_payments.rs): the same
# versions soroban-env-host already uses, so nothing new is downloaded.
ed25519-dalek = "2.2.0"
sha2 = "0.10.9"
# Step 5: the fee model (fees::FeeConfiguration, compute_rent_write_fee_per_1kb)
# for pricing each flow with each network's settings. The version
# soroban-sdk 27.0.6 already uses, from Cargo.lock; nothing new is downloaded.
soroban-env-host = "=27.0.1"
