[package]
name = "quietstay-measure"
version = "0.1.0"
edition = "2021"
description = "QuietStay Phase 3, Step 1 — measurement only: two Groth16 verifications in one transaction (docs/PHASE3_SPEC.md §11). Not part of the product."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
serde_json = "1"
